{% extends "base.html" %}

{% block title %}Sign In — leadTo Job Satisfaction{% endblock %}

{% block content %}
<div class="login-card">
    <div class="login-eyebrow">Job Satisfaction Analysis</div>
    <h1>Sign in</h1>
    {# Administrators only. A survey respondent never reaches this page: they
       open the anonymous link and are never asked who they are. #}
    <form method="post" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autofocus
                   value="{{ request.form.get('email', '') }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
</div>
{% endblock %}
