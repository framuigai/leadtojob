<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 88" width="212" height="88" role="img" aria-label="LeadTO — Lead, Optimize, Achieve">
  <!-- Full lockup: wordmark + tagline rule. Use only where the mark renders at
       roughly 60px tall or more (public footer, hero); below that the tagline is
       unreadable and logo.svg should be used instead. -->
  <text x="2" y="44"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"
    font-weight="800"
    font-size="44"
    letter-spacing="-1"><tspan fill="#ffffff">Lead</tspan><tspan fill="#F05A28">TO</tspan></text>
  <polyline points="166,15 181,29 166,43" fill="none" stroke="#F05A28" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polyline points="186,15 201,29 186,43" fill="none" stroke="#F05A28" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>

  <line x1="4" y1="72" x2="44" y2="72" stroke="#F05A28" stroke-width="2.5"/>
  <text x="56" y="75"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"
    font-weight="600"
    font-size="8.5"
    letter-spacing="1.8"
    fill="#ffffff">LEAD <tspan fill="#F05A28">&#8226;</tspan> OPTIMIZE <tspan fill="#F05A28">&#8226;</tspan> ACHIEVE</text>
</svg>
