<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 58" width="212" height="58" role="img" aria-label="LeadTO">
  <!-- Primary wordmark: "Lead" white, "TO" orange, double chevron.
       Tagline lockup lives in logo-full.svg — at nav size (32-34px tall) the
       tagline renders below 4px and is illegible, so it is not carried here. -->
  <text x="2" y="44"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"
    font-weight="800"
    font-size="44"
    letter-spacing="-1"><tspan fill="#ffffff">Lead</tspan><tspan fill="#F05A28">TO</tspan></text>
  <polyline points="166,15 181,29 166,43" fill="none" stroke="#F05A28" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polyline points="186,15 201,29 186,43" fill="none" stroke="#F05A28" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
